# ===================================
# SIGEA - Test Configuration
# ===================================
spring.application.name=SIGEA-Test
server.port=8080

# ===================================
# Database - H2 In-Memory
# ===================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===================================
# SQL Initialization - DISABLED
# ===================================
spring.sql.init.mode=never

# ===================================
# Email - DISABLED for tests
# ===================================
notificaciones.email.enabled=false
notificaciones.whatsapp.enabled=false
spring.mail.host=localhost
spring.mail.port=1025

# ===================================
# File Storage - Test Directory
# ===================================
media.location=./test-uploads
informe.upload.dir=./test-uploads/informes/

# ===================================
# Logging
# ===================================
logging.level.root=INFO
logging.level.com.zentry.sigea=DEBUG

# ===================================
# OpenAPI/Swagger - Disabled in Tests
# ===================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTIONTIMEOUT}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITETIMEOUT}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:*}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=${SMTP_SSL_CHECKSERVERIDENTITY}
spring.mail.default-encoding=${MAIL_DEFAULT_ENCODING}
spring.mail.properties.mail.mime.charset=${MAIL_MIME_CHARSET}

spring.security.user.name=test
spring.security.user.password=test
